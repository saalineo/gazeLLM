[package]
name = "gazellm"
version = "0.1.0"
edition = "2021"
description = "High-Performance LLM Serving Engine"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
tonic = "0.11"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"
libloading = "0.8"
thiserror = "2.0.21"
tokenizers = "0.23.2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[[test]]
name = "ffi_smoke_test"
path = "tests/ffi_smoke_test.rs"

[[test]]
name = "grpc_streaming_test"
path = "tests/grpc_streaming_test.rs"

[build-dependencies]
tonic-build = "0.11"

